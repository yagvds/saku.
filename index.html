<body><div class="app" id="app">
<aside id="side"><div class="logo">saku.<small>Finansial lebih terarah</small></div>
<nav id="nav"></nav>
<div class="streak"><b>7 hari konsisten</b>Kebiasaan kecil, dampak besar.<div class="dots"><i>✓</i><i>✓</i><i>✓</i><i>✓</i><i>✓</i><i>✓</i><i>✓</i></div>Teruskan catatanmu hari ini.</div>
<div class="m">Butuh bantuan? <a href="#pengaturan" style="color:var(--p)">Buka pusat bantuan ↗</a><br>© 2026 Saku</div></aside>
<main><div class="top"><button id="menu" aria-label="Buka menu">☰</button>
<div class="acct"><button id="acb" aria-haspopup="menu" aria-expanded="false" aria-controls="acm"><span class="nm"><b id="hn">Hai</b><span>Akun pribadi</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div id="acm" role="menu"></div></div><span class="chip">November 2026</span><button class="btn" data-open>+ Tambah transaksi</button></div>
<div id="view"></div></main><div id="bd"></div></div>
<div id="md" aria-hidden="true"><div class="bk" data-x></div><div class="win" id="win" role="dialog" aria-modal="true" aria-label="Catat transaksi"></div></div>
<div id="lg" class="off" role="dialog" aria-modal="true" aria-label="Masuk ke Saku"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Saku membutuhkan JavaScript untuk berjalan.</p></noscript>
<div id="ts" role="status" aria-live="polite"></div>
<script>
const NAV=[["ringkasan","Ringkasan"],["transaksi","Transaksi"],["akun","Akun saya"],["anggaran","Anggaran"],["target","Target tabungan"],["utang","Utang & piutang"],["berulang","Transaksi berulang"],["laporan","Laporan & insight"],["kategori","Kategori"],["pengaturan","Pengaturan"]];
const H=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>`;
const bar=(p,c="")=>`<div class="bar ${c}"><i style="width:${p}%"></i></div>`;
const stat=(l,v,s,c="")=>`<div class="card ${c}"><span class="m">${l}</span><div class="big">${v}</div><span class="m">${s}</span></div>`;
const row=(a,b,r,x="")=>`<div class="row"><div><b>${a}</b><small>${b}</small></div><div style="text-align:right"><span class="amt">${r}</span>${x}</div></div>`;
const chart=(i,e,max,l)=>`<div class="chart" role="img" aria-label="Grafik pemasukan dan pengeluaran">${i.map((v,k)=>`<div><i style="height:${v/max*100}%"></i><i style="height:${e[k]/max*100}%"></i></div>`).join("")}</div><div class="lab">${l.map(x=>`<span>${x}</span>`).join("")}</div><div class="lab" style="justify-content:center"><b style="color:var(--p)">■ Pemasukan</b><b style="color:#a58ff0">■ Pengeluaran</b></div>`;
const TX=[];
const BUD=[];
const accSel=`<option>Tunai</option><option>E-wallet</option><option>Bank utama</option>`;
const P={ringkasan:()=>"<h1></h1>"};
const nav=document.getElementById("nav"),view=document.getElementById("view"),app=document.getElementById("app");
nav.innerHTML=`<h6>Menu utama</h6>`+NAV.map(n=>`<a href="#${n[0]}" data-p="${n[0]}">${n[1]}</a>`).join("");
function draw(){const k=location.hash.slice(1);const id=P[k]?k:"ringkasan";view.innerHTML=P[id]();
nav.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.dataset.p==id));app.classList.remove("open");window.scrollTo(0,0);
if(id=="transaksi"){const q=document.getElementById("q"),ty=document.getElementById("ty"),tb=document.getElementById("tb"),c=document.getElementById("cnt");

<div class="card"><h3>Ke mana uangmu pergi?</h3><span class="m">Proporsi per kategori</span><div class="donut" style="background:conic-gradient(${st})"><b>Total<br>${cj(exp)}</b></div>${bs.map(b=>row(E(b.c),"",money(b.u),`<small>${pf(exp?b.u/exp*100:0)}%</small>`)).join("")}</div></div>
<div class="g g2"><div class="card"><h3>Emotional spending</h3><span class="m">${pf(100-mp("Belum ditandai"))}% nominal pengeluaran sudah ditandai mood.</span>${MO.map(k=>`<div class="m" style="margin-top:8px">${k}<b style="float:right">${pf(mp(k))}%</b></div>${bar(mp(k))}`).join("")}</div>
<div class="card d"><span class="pill ${proj<0?"w":"ok"}">${proj<0?"Perlu penyesuaian":"Aman"}</span><h3 style="margin-top:10px">Prediksi akhir bulan</h3><div class="big">${money(proj)}</div><span class="m">Perkiraan saldo bebas ${DIM} ${MF[MI]}</span>${row("Saldo bebas saat ini","",money(free_))}${row("Rata-rata pengeluaran harian","",money(Math.round(avg)))}<p class="m">${avg>0?"Cukup ±"+Math.floor(free_/avg)+" hari":"Belum ada pengeluaran"}. Estimasi historis, bukan jaminan saldo.</p></div></div>
<div class="card"><h3>Biaya kecil yang mudah terlewat</h3>${(f=>f.length?`<span class="m">${f.length} pola pembayaran rutin · Potensi biaya ${money(f.reduce((s,v)=>s+v.a,0))} per bulan</span>`+f.map(v=>row(E(v.n),rp(v.a)+" / bulan · muncul di "+v.ms.size+" bulan","",`<a class="pill" href="#transaksi">Tinjau transaksi →</a>`)).join("")+`<p class="m" style="margin-top:10px">Konfirmasi atau abaikan saran; kategori transaksi tidak diubah otomatis.</p>`:'<p class="m" style="margin-top:8px">Belum ada pola terdeteksi. Pola muncul saat catatan dan nominal yang sama tercatat di dua bulan atau lebih.</p>')(fees())}</div>`};

const ONB='<div class="card d" style="margin-bottom:16px"><h3>Mulai dari akun pertamamu</h3><p class="m">Tambahkan dompet, rekening, atau e-wallet beserta saldo awalnya. Setelah itu kamu bisa mulai mencatat transaksi.</p><p style="margin-top:12px"><button class="btn ghost" data-a="acct">+ Tambah akun</button></p></div>';
const fees=()=>{const m={};S.tx.filter(x=>x.t=="Pengeluaran").forEach(x=>{const k=(x.n||x.c).toLowerCase()+"|"+x.a;(m[k]=m[k]||{n:x.n||x.c,a:x.a,ms:new Set()}).ms.add(x.d.slice(0,7))});return Object.values(m).filter(v=>v.ms.size>=2)};
const dl=(name,type,data)=>{try{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast("File "+name+" diunduh")}catch(_){toast("Gagal mengunduh file")}};
const stk=()=>{const el=document.querySelector(".streak");if(!el)return;const n=new Date(),dk=o=>{const t=new Date(n.getFullYear(),n.getMonth(),n.getDate()-o);return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())},has=new Set(S.tx.map(x=>x.d));let o=has.has(dk(0))?0:1,c=0;while(has.has(dk(o))){c++;o++}
el.innerHTML=`<b>${c?c+" hari konsisten":"Mulai catat hari ini"}</b>Kebiasaan kecil, dampak besar.<div class="dots">${[6,5,4,3,2,1,0].map(k=>has.has(dk(k))?"<i>✓</i>":'<i style="opacity:.25"></i>').join("")}</div>${has.has(dk(0))?"Hebat, hari ini sudah tercatat.":"Teruskan catatanmu hari ini."}`};

NAV.length=0;NAV.push(["ringkasan","Ringkasan"],["transaksi","Transaksi"],["akun","Akun saya"],["anggaran","Anggaran"],["target","Target tabungan"],["utang","Utang & piutang"],["laporan","Laporan & insight"],["pengaturan","Pengaturan"]);
nav.innerHTML="<h6>Menu utama</h6>"+NAV.map(n=>`<a href="#${n[0]}" data-p="${n[0]}">${n[1]}</a>`).join("");
const hp=document.querySelector("aside>.m");if(hp)hp.innerHTML="© 2026 Saku";
const LOCAL="Data tersimpan di perangkat ini";
P.pengaturan=()=>H("Pengaturan","Atur pengalaman yang paling nyaman untukmu.")+`<div class="g gs"><div class="card" style="text-align:center"><span class="av" id="sav" style="width:72px;height:72px;font-size:28px;margin:4px auto 12px">${E(ini())}</span><h3 id="sn">${E(U.name)}</h3><span class="m">${LOCAL}</span><div style="margin:12px 0"><span class="pill">Akun pribadi</span></div></div><div class="card"><div class="tabs" id="st">${[["profil","Profil"],["privasi","Privasi & data"]].map(s=>`<button data-s="${s[0]}" class="${s[0]==SET?"on":""}">${s[1]}</button>`).join("")}</div><div id="sp">${(SP[SET]||SP.profil)()}</div></div></div>`;
SP.profil=()=>`<h3>Profil</h3><span class="m">Nama yang tampil di sapaan.</span><label for="pn">Nama panggilan</label><input id="pn" value="${E(U.name)}" maxlength="40"><div class="g g2" style="margin:0"><div><label>Zona waktu</label><input value="Asia/Jakarta (WIB)" disabled></div><div><label>Mata uang</label><input value="IDR Rupiah" disabled></div></div><button class="btn" id="sv-p" style="margin-top:18px">Simpan perubahan</button>`;
SP.privasi=()=>`<h3>Privasi & data</h3><span class="m">Data keuanganmu tersimpan hanya di browser perangkat ini dan tidak dikirim ke server. Buat cadangan secara berkala, karena data hilang jika data browser dibersihkan.</span>${tg("hg","Sembunyikan saldo","Samarkan nominal menjadi ••••••••. Bisa juga lewat ikon mata di dashboard.",document.body.classList.contains("hide"))}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn ghost" data-a="backup">↓ Unduh cadangan</button><button class="btn ghost" data-a="restore">↑ Pulihkan cadangan</button><button class="btn ghost" data-a="wipe" style="color:var(--bad)">Hapus semua data</button></div><input type="file" id="rf" accept="application/json" hidden>`;
acm=function(){$("acm").innerHTML=`<div class="ah"><span class="av">${E(ini())}</span><div><b>${E(U.name)}</b><small>${LOCAL}</small></div></div><div class="sep"></div>`+[["profil","Profil"],["privasi","Privasi & data"]].map(s=>`<button role="menuitem" data-s="${s[0]}">${s[1]}</button>`).join("");$("hn").textContent="Hai, "+U.name.split(" ")[0]};
lgForm=function(){const c=$("lcard");c.innerHTML=`<h1 style="font-size:28px">Selamat datang di Saku</h1><p class="sub" style="margin-bottom:8px">Catat keuanganmu dengan lebih tenang. Mulai dengan nama panggilanmu.</p><form id="lgf" novalidate><label for="ln">Nama panggilan</label><input id="ln" autocomplete="nickname" maxlength="40" placeholder="Contoh: Alya"><p class="err" id="lerr" role="alert"></p><button class="btn w" id="lbtn" type="submit">Mulai</button></form><p class="m" style="text-align:center;margin-top:18px">Datamu tersimpan hanya di browser perangkat ini dan tidak dikirim ke server. Buat cadangan di Pengaturan secara berkala.</p>`;c.style.animation="none";void c.offsetWidth;c.style.animation=""};
doLogin=function(){const nm=$("ln").value.trim(),c=$("lcard");if(nm.length<2){$("lerr").textContent="Masukkan nama minimal 2 karakter";$("ln").focus();c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");return}login({name:nm,email:LOCAL},true)};
saveF=function(){const n=$("nt");if(n)M.n=E(n.value)};

const p0=post;post=function(id){p0(id);if(id=="transaksi")txInit();stk()};
const o0=openM;openM=function(){if(!S.accts.length){toast("Tambahkan akun dulu sebelum mencatat transaksi");location.hash="akun";return}DLG=null;o0()};
const c0=closeM;closeM=function(){DLG=null;c0()};
const h0=mHTML;mHTML=function(){return h0().replace('value="20 November 2026"','value="'+DN+" "+MF[MI]+" "+Y+'"')};
fb=function(){return money(tot()-totRes()+(M.t=="Pengeluaran"?-M.a:M.t=="Pemasukan"?M.a:0))};
save=function(){if(DLG){DLG();return}
saveF();if(!M.a){toast("Isi nominal dulu");$("nom").focus();return}
const t=M.t,ac=$("ac").value,ct=$("ct").value,dt=pd($("dt").value);
if(!dt){toast("Format tanggal: 20 November 2026");$("dt").focus();return}
if(t=="Transfer"&&ac==ct){toast("Pilih akun asal dan tujuan yang berbeda");return}
if(t!="Pemasukan"&&M.a>bal(A(ac))){toast("Saldo "+ac+" tidak cukup ("+money(bal(A(ac)))+")");return}
S.tx.unshift({id:uid(),d:dt,t,a:M.a,ac,c:t=="Transfer"?"Transfer":ct,to:t=="Transfer"?ct:undefined,m:t=="Pengeluaran"?M.m:"–",n:$("nt").value.trim()});sv();
const am=rp(M.a);closeM();toast(t+" "+am+" tersimpan");M.a=0;M.n="";draw()};

function dlg(title,sub,body,ok,cb){win.innerHTML=`<div class="mh"><div><h2>${title}</h2><span class="m">${sub}</span></div><button class="x" data-x aria-label="Tutup">✕</button></div>${body}<div class="mf"><span></span><button class="btn" id="save">${ok}</button></div>`;
md.classList.add("on");md.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";DLG=cb;setTimeout(()=>{const i=win.querySelector("input,select");i&&i.focus()},200)}
const done=m=>{sv();closeM();toast(m);draw()};
const RPI=(id,v)=>`<input id="${id}" class="rpi" inputmode="numeric" placeholder="Rp0" value="${v?rp(v):""}">`;
const ACT={
transfer(){const f=$("tf").value,t=$("tt").value,a=num("tn"),d=new Date(),dt=YM+"-"+pad(DN);
if(!a){toast("Isi nominal transfer");return}if(f==t){toast("Pilih akun asal dan tujuan yang berbeda");return}if(a>bal(A(f))){toast("Saldo "+f+" tidak cukup ("+money(bal(A(f)))+")");return}
S.tx.unshift({id:uid(),d:dt,t:"Transfer",a,ac:f,c:"Transfer",to:t,m:"–",n:$("tm").value.trim()||"Transfer antar akun"});sv();toast("Transfer "+rp(a)+" dicatat di kedua akun");draw()},
acct(){dlg("Tambah akun","Dompet, rekening, atau e-wallet baru.",`<label for="an">Nama akun</label><input id="an" maxlength="30"><label for="ak">Jenis</label><select id="ak"><option>Rekening bank</option><option>Dompet harian</option><option>Dompet digital</option><option>Lainnya</option></select><label for="ao">Saldo awal</label>${RPI("ao")}`,"Simpan akun",()=>{const n=$("an").value.trim();if(n.length<2){toast("Nama akun minimal 2 karakter");return}if(A(n)){toast("Nama akun sudah dipakai");return}
S.accts.push({n,k:$("ak").value,open:num("ao")});sy();done("Akun "+n+" ditambahkan")})},
bud(b){const c=b.dataset.c;dlg("Ubah batas anggaran",E(c),`<label for="bl">Batas bulanan</label>${RPI("bl",S.bud[c])}`,"Simpan batas",()=>{const v=num("bl");if(!v){toast("Isi batas anggaran");return}S.bud[c]=v;done("Batas "+c+" diperbarui")})},
alloc(b){const g=S.goals.find(x=>x.id==b.dataset.g),k=g.tgt-gal(g);if(k<=0){toast("Target ini sudah tercapai");return}
dlg("Alokasikan dana",E(g.n)+" · kurang "+money(k),`<label for="da">Dari akun</label><select id="da">${S.accts.map(a=>`<option value="${E(a.n)}">${E(a.n)} · bebas ${money(free(a))}</option>`).join("")}</select><label for="dn">Nominal</label>${RPI("dn")}`,"Alokasikan",()=>{const n=$("da").value,a=num("dn");
if(!a){toast("Isi nominal");return}if(a>free(A(n))){toast("Melebihi saldo bebas "+n);return}if(a>k){toast("Melebihi kebutuhan target ("+money(k)+")");return}g.al[n]=(g.al[n]||0)+a;done(rp(a)+" dialokasikan ke "+g.n)})},
rel(b){const g=S.goals.find(x=>x.id==b.dataset.g),es=Object.entries(g.al).filter(e=>e[1]>0);if(!es.length){toast("Belum ada dana yang dialokasikan");return}
dlg("Lepas dana",E(g.n),`<label for="da">Dari alokasi di akun</label><select id="da">${es.map(e=>`<option value="${E(e[0])}">${E(e[0])} · ${money(e[1])}</option>`).join("")}</select><label for="dn">Nominal</label>${RPI("dn")}`,"Lepas dana",()=>{const n=$("da").value,a=num("dn");
if(!a){toast("Isi nominal");return}if(a>(g.al[n]||0)){toast("Melebihi alokasi di "+n);return}g.al[n]-=a;done(rp(a)+" kembali ke saldo bebas")})},
goal(){dlg("Buat target tabungan","Mulai dari nominal yang realistis.",`<label for="gn">Nama target</label><input id="gn" maxlength="40"><label for="gt">Nominal target</label>${RPI("gt")}<label for="gd">Target waktu</label><input id="gd" placeholder="Contoh: Desember 2027" maxlength="30">`,"Simpan target",()=>{const n=$("gn").value.trim(),t=num("gt");
if(n.length<2){toast("Isi nama target");return}if(!t){toast("Isi nominal target");return}S.goals.push({id:uid(),n,tag:"Target baru",due:$("gd").value.trim()||"Fleksibel",tgt:t,al:{}});done("Target "+n+" dibuat")})},
pay(){const g=debtSel(),a=num("pa"),ac=$("pac").value,dt=pd($("pdt").value);
if(!dt){toast("Format tanggal: 20 November 2026");return}if(!a){toast("Isi nominal");return}if(a>remain(g)){toast("Melebihi sisa "+money(remain(g)));return}
const ut=g.kind=="Utang";if(ut&&a>bal(A(ac))){toast("Saldo "+ac+" tidak cukup");return}
g.paid.push({d:dt,a});S.tx.unshift({id:uid(),d:dt,t:ut?"Pengeluaran":"Pemasukan",a,ac,c:ut?"Lainnya":"Pendapatan",m:"–",n:(ut?"Cicilan ":"Pembayaran dari ")+g.n});sv();toast(remain(g)<=0?"Lunas! "+g.n+" selesai":"Pembayaran dicatat, sisa "+money(remain(g)));draw()},
csv(){if(!S.tx.length){toast("Belum ada transaksi untuk diekspor");return}const q=v=>{v=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
dl("saku-transaksi-"+YM+".csv","text/csv;charset=utf-8","\ufeff"+[["Tanggal","Jenis","Nominal","Akun","Ke akun","Kategori","Mood","Catatan"]].concat(sorted().map(x=>[x.d,x.t,x.a,x.ac,x.to,x.c,x.m,x.n])).map(r=>r.map(q).join(",")).join("\r\n"))},
backup(){dl("saku-cadangan-"+YM+"-"+pad(DN)+".json","application/json",JSON.stringify(S,null,1))},
restore(){$("rf").click()},
wipe(){dlg("Hapus semua data","Tindakan ini tidak bisa dibatalkan.",'<p class="m" style="margin-top:8px">Semua akun, transaksi, anggaran, target, dan catatan utang di perangkat ini akan dihapus. Unduh cadangan dulu bila perlu.</p>',"Ya, hapus semua",()=>{seed();sv();sy();SD=null;M.a=0;M.n="";done("Semua data dihapus")})},
cat(){dlg("Tambah kategori","Kategori pengeluaran baru.",`<label for="cn">Nama kategori</label><input id="cn" maxlength="30"><label for="cl">Batas bulanan (opsional)</label>${RPI("cl")}`,"Simpan kategori",()=>{const n=$("cn").value.trim();if(n.length<2){toast("Nama kategori minimal 2 karakter");return}if(n in S.bud){toast("Kategori sudah ada");return}S.bud[n]=num("cl");sy();done("Kategori "+n+" ditambahkan")})},
debt(){dlg("Catat utang/piutang","Catatan saja, tidak mengubah saldo akun.",`<label for="dnm">Nama pihak</label><input id="dnm" maxlength="40"><label for="dk">Jenis</label><select id="dk"><option>Utang</option><option>Piutang</option></select><label for="dsb">Keterangan (opsional)</label><input id="dsb" maxlength="40"><label for="dt2">Jumlah pokok</label>${RPI("dt2")}<label for="ddu">Jatuh tempo (opsional)</label><input id="ddu" placeholder="Contoh: 25 Desember 2026">`,"Simpan catatan",()=>{const n=$("dnm").value.trim(),t=num("dt2"),k=$("dk").value,due=$("ddu").value.trim(),p=due?pd(due):"";
if(n.length<2){toast("Isi nama pihak");return}if(!t){toast("Isi jumlah pokok");return}if(due&&!p){toast("Format tanggal: 25 Desember 2026");return}const g={id:uid(),n,sub:$("dsb").value.trim()||(k=="Utang"?"Pinjaman":"Pinjaman personal"),kind:k,due:p,total:t,paid:[]};S.debts.push(g);SD=g.id;done("Catatan "+n+" disimpan")})},
rm(b){const t=b.dataset.t,id=b.dataset.id;
if(t=="acct"){const a=A(id);if(S.tx.some(x=>x.ac==id||x.to==id)){toast("Akun masih punya transaksi. Hapus transaksinya dulu");return}if(res(a)>0){toast("Lepas dana target di akun ini dulu");return}dlg("Hapus akun",E(id),"","Hapus akun",()=>{S.accts=S.accts.filter(x=>x.n!=id);sy();done("Akun dihapus")})}
else if(t=="goal"){dlg("Hapus target","Dana yang dialokasikan kembali menjadi saldo bebas.","","Hapus target",()=>{S.goals=S.goals.filter(x=>x.id!=id);done("Target dihapus")})}
else if(t=="debt"){dlg("Hapus catatan","Transaksi pembayaran yang sudah tercatat tetap ada.","","Hapus catatan",()=>{S.debts=S.debts.filter(x=>x.id!=id);SD=null;done("Catatan dihapus")})}},
};
document.addEventListener("change",e=>{if(e.target.id!="rf")return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result),ok=s&&s.v==1&&Array.isArray(s.accts)&&Array.isArray(s.tx)&&Array.isArray(s.goals)&&Array.isArray(s.debts)&&s.bud&&typeof s.bud=="object"&&s.accts.every(a=>a&&typeof a.n=="string"&&isFinite(a.open))&&s.tx.every(x=>x&&isFinite(x.a)&&/^\d{4}-\d{2}-\d{2}$/.test(x.d));if(!ok)throw 0;S=s;sv();sy();SD=null;draw();toast("Cadangan dipulihkan")}catch(_){toast("File cadangan tidak valid")}};r.readAsText(f);e.target.value=""});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a],[data-del],[data-debt]");if(!b)return;e.stopImmediatePropagation();lastBtn=b;
if(b.dataset.a){ACT[b.dataset.a](b);return}
if(b.dataset.del){S.tx=S.tx.filter(x=>x.id!=b.dataset.del);sv();toast("Transaksi dihapus, saldo diperbarui");draw();return}
if(b.dataset.debt){SD=b.dataset.debt;draw();return}},true);
document.addEventListener("input",e=>{const t=e.target;if(t.classList&&t.classList.contains("rpi")){const v=+t.value.replace(/\D/g,"").slice(0,11)||0;t.value=v?rp(v):"";if(t.id=="pa"&&$("rem"))setBal($("rem"),money(Math.max(0,remain(debtSel())-v)))}});
lgView();M.a=0;M.n="";sy();document.querySelector(".chip").textContent=MF[MI]+" "+Y;draw();
})();
</script>
</body></html>
